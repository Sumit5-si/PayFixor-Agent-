version: '3.8'

services:
  db:
    image: postgres:16-alpine
    container_name: payfixor_postgres
    environment:
      POSTGRES_USER: payfixor
      POSTGRES_PASSWORD: payfixor_secret
      POSTGRES_DB: payfixordb
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: payfixor_backend
    environment:
      - DATABASE_URL=postgresql+asyncpg://payfixor:payfixor_secret@db:5432/payfixordb
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - RAZORPAY_KEY_ID=${RAZORPAY_KEY_ID}
      - RAZORPAY_KEY_SECRET=${RAZORPAY_KEY_SECRET}
      - RAZORPAY_WEBHOOK_SECRET=${RAZORPAY_WEBHOOK_SECRET}
    ports:
      - "8000:8000"
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata:
